name: Build Ubuntu Linux

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Frontend tests
        run: npm run test:frontend

      - name: Backend tests
        run: npm run test:backend

      - name: Verify updater signing key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required for tagged releases" >&2
            exit 1
          fi

      - name: Build Ubuntu packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ARGS=(--bundles deb,appimage)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ARGS+=(--config src-tauri/tauri.updater.conf.json)
          fi
          npm run tauri -- build "${ARGS[@]}"

      - name: Generate Linux updater manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ASSET=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)
          node scripts/generate-updater-manifest.mjs \
            --target linux-x86_64 \
            --asset "$ASSET" \
            --signature "$ASSET.sig" \
            --output src-tauri/target/release/bundle/appimage/updater-linux-x86_64.json

      - name: Upload Ubuntu artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GitEasy-Ubuntu-x86_64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/appimage/updater-linux-x86_64.json

      - name: Publish Ubuntu release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: GitEasy ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: docs/DOWNLOADS.md
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/appimage/updater-linux-x86_64.json

