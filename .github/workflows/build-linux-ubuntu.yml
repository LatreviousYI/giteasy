name: Build Ubuntu Linux

on:
  workflow_call:
    inputs:
      version:
        description: Version to embed in release artifacts
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Apply release version
        run: node scripts/apply-version.mjs "${{ inputs.version }}"

      - name: Frontend tests
        run: npm run test:frontend

      - name: Backend tests
        run: npm run test:backend

      - name: Verify updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required for releases" >&2
            exit 1
          fi

      - name: Build Ubuntu packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run tauri -- build \
            --bundles deb,appimage \
            --config src-tauri/tauri.updater.conf.json

      - name: Generate Linux updater manifest
        run: |
          ASSET=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)
          node scripts/generate-updater-manifest.mjs \
            --target linux-x86_64 \
            --asset "$ASSET" \
            --signature "$ASSET.sig" \
            --output src-tauri/target/release/bundle/appimage/updater-linux-x86_64.json

      - name: Stage release assets
        run: |
          mkdir -p release
          cp src-tauri/target/release/bundle/deb/*.deb release/
          cp src-tauri/target/release/bundle/appimage/*.AppImage release/
          cp src-tauri/target/release/bundle/appimage/*.AppImage.sig release/
          cp src-tauri/target/release/bundle/appimage/updater-linux-x86_64.json release/

      - name: Upload Ubuntu artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GitEasy-Release-Linux-x86_64
          if-no-files-found: error
          path: release/*

