name: Publish GitHub Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      sign_apple:
        description: Sign and notarize the macOS bundle
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release version
        id: version
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "Releases must run from master." >&2
            exit 1
          fi

          HEAD_TAG=$(git tag --points-at "$GITHUB_SHA" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -1 || true)

          if [ -n "$HEAD_TAG" ]; then
            VERSION="${HEAD_TAG#v}"
            echo "Reusing ${HEAD_TAG} for the current commit."
          else
            LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG="v0.1.0"
            fi

            BASE_VERSION="${LATEST_TAG#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
            BUMP=patch
            COMMIT_MESSAGE=$(git log -1 --pretty=%B)
            if grep -qiE '\[major\]|#major' <<< "$COMMIT_MESSAGE"; then
              BUMP=major
            elif grep -qiE '\[minor\]|#minor' <<< "$COMMIT_MESSAGE"; then
              BUMP=minor
            fi

            case "$BUMP" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac

            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "Calculated a ${BUMP} release from ${LATEST_TAG}: v${VERSION}."
          fi

          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG} from ${GITHUB_SHA}."

  build-linux:
    needs: prepare
    uses: ./.github/workflows/build-linux-ubuntu.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  build-macos:
    needs: prepare
    uses: ./.github/workflows/build-macos-arm64.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      sign: ${{ inputs.sign_apple || false }}
    secrets: inherit

  publish:
    needs:
      - prepare
      - build-linux
      - build-macos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: GitEasy-Release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release version
        run: |
          jq -e '.version == "${{ needs.prepare.outputs.version }}"' \
            release-assets/updater-linux-x86_64.json
          jq -e '.version == "${{ needs.prepare.outputs.version }}"' \
            release-assets/updater-darwin-aarch64.json

      - name: Verify release assets
        run: |
          test -n "$(find release-assets -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.AppImage.sig' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          test -f release-assets/updater-linux-x86_64.json
          test -f release-assets/updater-darwin-aarch64.json
          find release-assets -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: GitEasy ${{ needs.prepare.outputs.tag }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: docs/DOWNLOADS.md
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release-assets/*.deb
            release-assets/*.AppImage
            release-assets/*.AppImage.sig
            release-assets/*.dmg
            release-assets/*.app.tar.gz
            release-assets/*.app.tar.gz.sig
            release-assets/updater-linux-x86_64.json
            release-assets/updater-darwin-aarch64.json
