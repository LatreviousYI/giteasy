name: Build macOS Apple Silicon

on:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarize the macOS bundle
        type: boolean
        default: false
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Frontend tests
        run: npm run test:frontend

      - name: Backend tests for macOS
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tee macos-backend.log

      - name: Upload backend failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GitEasy-macOS-backend-failure
          if-no-files-found: ignore
          path: macos-backend.log

      - name: Build Apple Silicon app and DMG
        env:
          APPLE_CERTIFICATE: ${{ inputs.sign && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.sign && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ inputs.sign && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ inputs.sign && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.sign && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.sign && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -o pipefail
          npm run tauri -- build --target aarch64-apple-darwin --bundles app,dmg 2>&1 | tee macos-build.log

      - name: Upload build failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GitEasy-macOS-build-failure
          if-no-files-found: ignore
          path: macos-build.log

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GitEasy-macOS-arm64
          if-no-files-found: error
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
