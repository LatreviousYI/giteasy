name: Build macOS Apple Silicon

on:
  workflow_call:
    inputs:
      version:
        description: Version to embed in release artifacts
        required: true
        type: string
      sign:
        description: Sign and notarize the macOS bundle
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Apply release version
        run: node scripts/apply-version.mjs "${{ inputs.version }}"

      - name: Verify updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required for releases" >&2
            exit 1
          fi

      - name: Build unsigned Apple Silicon app and DMG
        if: ${{ !inputs.sign }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          npm run tauri -- build \
            --target aarch64-apple-darwin \
            --bundles app,dmg \
            --config src-tauri/tauri.updater.conf.json \
            2>&1 | tee macos-build.log

      - name: Build signed Apple Silicon app and DMG
        if: ${{ inputs.sign }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          npm run tauri -- build \
            --target aarch64-apple-darwin \
            --bundles app,dmg \
            --config src-tauri/tauri.updater.conf.json \
            2>&1 | tee macos-build.log

      - name: Upload build failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GitEasy-macOS-build-failure
          if-no-files-found: ignore
          path: macos-build.log

      - name: Generate macOS updater manifest
        run: |
          ASSET=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name '*.app.tar.gz' -print -quit)
          node scripts/generate-updater-manifest.mjs \
            --target darwin-aarch64 \
            --asset "$ASSET" \
            --signature "$ASSET.sig" \
            --output src-tauri/target/aarch64-apple-darwin/release/bundle/macos/updater-darwin-aarch64.json

      - name: Stage release assets
        run: |
          mkdir -p release
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg release/
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz release/
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig release/
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/macos/updater-darwin-aarch64.json release/

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GitEasy-Release-macOS-arm64
          if-no-files-found: error
          path: release/*

      - name: Upload macOS app bundle for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: GitEasy-macOS-app-bundle
          if-no-files-found: error
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
