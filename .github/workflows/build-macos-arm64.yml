name: Build macOS Apple Silicon

on:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarize the macOS bundle
        type: boolean
        default: false
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Frontend tests
        run: npm run test:frontend

      - name: Backend tests for macOS
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tee macos-backend.log

      - name: Upload backend failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GitEasy-macOS-backend-failure
          if-no-files-found: ignore
          path: macos-backend.log

      - name: Verify updater signing key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required for tagged releases" >&2
            exit 1
          fi

      - name: Build unsigned Apple Silicon app and DMG
        if: ${{ !inputs.sign }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ARGS=(--target aarch64-apple-darwin --bundles app,dmg)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ARGS+=(--config src-tauri/tauri.updater.conf.json)
          fi
          npm run tauri -- build "${ARGS[@]}" 2>&1 | tee macos-build.log

      - name: Build signed Apple Silicon app and DMG
        if: ${{ inputs.sign }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ARGS=(--target aarch64-apple-darwin --bundles app,dmg)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ARGS+=(--config src-tauri/tauri.updater.conf.json)
          fi
          npm run tauri -- build "${ARGS[@]}" 2>&1 | tee macos-build.log

      - name: Upload build failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GitEasy-macOS-build-failure
          if-no-files-found: ignore
          path: macos-build.log

      - name: Generate macOS updater manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ASSET=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name '*.app.tar.gz' -print -quit)
          node scripts/generate-updater-manifest.mjs \
            --target darwin-aarch64 \
            --asset "$ASSET" \
            --signature "$ASSET.sig" \
            --output src-tauri/target/aarch64-apple-darwin/release/bundle/macos/updater-darwin-aarch64.json

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GitEasy-macOS-arm64
          if-no-files-found: error
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/updater-darwin-aarch64.json
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Publish macOS release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: GitEasy ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: docs/DOWNLOADS.md
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/updater-darwin-aarch64.json
